<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그냥</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a href="#" class="logo">그냥</a>
    <nav id="filters" aria-label="곡 / 음반 보기"></nav>
  </header>

  <!-- 1) 목록 화면 -->
  <main id="home" class="view">
    <div class="home-bg" id="homeBg"></div>
    <section class="intro">
      <div class="intro-text" id="introText">
        <h1 id="siteTitle"></h1>
        <p id="siteDesc"></p>
      </div>
      <span class="scroll-hint" aria-hidden="true">↓</span>
    </section>
    <div id="panes" class="panes">
      <!-- 곡 보기 (앨범 목록) -->
      <div id="grid" class="grid pane"></div>
      <!-- 음반 보기 (LP 모양, 누르면 오른쪽에 설명글) -->
      <section id="records" class="records pane" hidden>
        <div class="rec-list" id="recList"></div>
      </section>
    </div>
    <section class="team" id="team">
      <h2>About us</h2>
      <div class="team-grid" id="teamGrid"></div>
    </section>
  </main>

  <!-- 2) 앨범 상세 화면 -->
  <main id="detail" class="view" hidden>
    <section class="hero">
      <div class="hero-bg" id="heroBg"></div>
      <a href="#" class="back">← 목록</a>
      <div class="hero-inner">
        <div class="hero-cover" id="heroCover"></div>
        <div class="hero-text">
          <h1 id="dTitle"></h1>
          <p class="meta" id="dMeta"></p>
        </div>
      </div>
    </section>
    <section class="tracks">
      <h2>수록곡</h2>
      <ol id="trackList"></ol>
    </section>
  </main>

  <!-- 3) 재생 화면 (곡을 누르면 위에 뜸) -->
  <div id="player" role="dialog" aria-label="곡 재생">
    <div class="p-bg" id="pBg"></div>
    <button class="p-logo" id="pLogo" aria-label="앨범으로 돌아가기"></button>
    <button class="p-close" id="pClose" aria-label="닫기">✕</button>
    <div class="p-body">
      <div class="p-left">
        <div class="p-stage">
          <div class="p-disc" id="pDisc"><div class="p-disc-spin"><div class="p-disc-label" id="pDiscLabel"></div></div></div>
          <div class="p-cover" id="pCover"></div>
        </div>
        <h2 id="pTitle"></h2>
        <p id="pArtist"></p>
        <p class="p-msg" id="pMsg" hidden></p>
        <a class="sp-btn" id="pSpBtn" target="_blank" rel="noopener">Spotify에서 듣기 ↗</a>
        <div class="p-ctrl">
          <input type="range" id="pBar" min="0" max="1000" value="0" aria-label="재생 위치">
          <div class="p-time"><span id="pCur">0:00</span><span id="pDur">0:00</span></div>
          <div class="p-nav">
            <button id="pPrev" aria-label="이전 곡">⏮</button>
            <button id="pToggle" class="main" aria-label="재생/일시정지">▶</button>
            <button id="pNext" aria-label="다음 곡">⏭</button>
          </div>
        </div>
      </div>
      <div class="p-lyrics" id="pLyrics"><div class="p-lines" id="pLines"></div></div>
    </div>
  </div>

  <!-- 4) 음반 설명 화면 (음반을 누르면 위에 뜸: 뒷배경은 흐리게, 음반은 선명하게, 설명은 오른쪽) -->
  <div id="recView" role="dialog" aria-label="음반 설명">
    <div class="rv-bg" id="rvBg"></div>
    <button class="rv-close" id="rvClose" aria-label="닫기">✕</button>
    <div class="rv-body" id="rvBody">
      <div class="rv-disc"><div class="disc-spin"><div class="disc-label" id="rvLabel"></div></div></div>
      <div class="rv-info">
        <h2 id="rvTitle"></h2>
        <p class="meta" id="rvMeta"></p>
        <p class="rec-desc" id="rvDesc"></p>
      </div>
    </div>
  </div>

  <!-- 소리를 내는 숨은 유튜브 재생기 (화면 효과와 상관없이 항상 같은 자리) -->
  <div class="p-yt"><div id="pYT"></div></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
